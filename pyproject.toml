[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-python-ai-agents"
version = "0.1.0"
description = "Learn LLM workflows and build a local calendar agent without agent frameworks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.68,<3", "pydantic>=2.8,<3", "python-dotenv>=1,<2", "tzdata>=2024.1"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
pure-agents = "pure_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pure_agents = ["kb.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
